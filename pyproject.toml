[project]
name = "slskd-mcp"
version = "0.1.0"
description = "MCP server for slskd — search the Soulseek network from an AI agent, with record-label filtering and a wishlist"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
keywords = ["mcp", "slskd", "soulseek", "music"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "mcp>=2.0",
    "slskd-api>=0.2.4",
]

[project.urls]
Source = "https://github.com/vectorless/slskd-mcp"

[project.scripts]
slskd-mcp = "slskd_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slskd_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
