[package]
name = "slskd-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server giving AI agents structured access to the Soulseek network via slskd"

[dependencies]
slskd-client = { path = "../slskd-client" }
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
